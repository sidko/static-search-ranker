name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.repository.full_name == 'sidko/static-search-ranker'
    runs-on: ubuntu-24.04
    environment: npm
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11.19.1
      - name: Verify the release tag matches package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$package_version"
      - name: Install and test
        run: |
          npm ci
          npm test
      - name: Publish a stable release with provenance
        if: github.event.release.prerelease == false
        run: npm publish --access public --provenance
      - name: Publish a prerelease with provenance
        if: github.event.release.prerelease == true
        run: npm publish --access public --provenance --tag next
