name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Pack the distribution
        run: |
          mkdir artifacts
          npm pack --json --pack-destination artifacts > artifacts/pack.json
      - name: Run the example from a clean consumer install
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(node -e \"const pack=require('./artifacts/pack.json'); process.stdout.write(pack[0].filename)\")"
          consumer_dir="$(mktemp -d)"
          cp examples/porto-guides.mjs "$consumer_dir/"
          pushd "$consumer_dir"
          npm init --yes
          npm install "$GITHUB_WORKSPACE/artifacts/$package_file"
          node porto-guides.mjs
          popd
