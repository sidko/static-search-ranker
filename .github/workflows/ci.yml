name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Pack the distribution
        run: |
          mkdir artifacts
          npm pack --json --pack-destination artifacts > artifacts/pack.json
      - name: Run the example from a clean consumer install
        shell: bash
        run: |
          set -euo pipefail
          package_file="$(node -p 'require("./artifacts/pack.json")[0].filename')"
          consumer_dir="$(mktemp -d)"
          cp examples/gale-finance-search.mjs "$consumer_dir/"
          pushd "$consumer_dir"
          npm init --yes
          npm install "$GITHUB_WORKSPACE/artifacts/$package_file"
          node gale-finance-search.mjs
          popd
